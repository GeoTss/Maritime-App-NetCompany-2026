name: pharos

x-node: &node
  build: .
  image: pharos-node:dev
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pharos
      POSTGRES_PASSWORD: pharos
      POSTGRES_DB: pharos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharos -d pharos"]
      interval: 3s
      timeout: 3s
      retries: 20

  erp:
    <<: *node
    command: ["npm", "run", "start", "-w", "@pharos/erp-sim"]
    environment:
      ERP_PORT: "4100"
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *node
    command: ["npm", "run", "start", "-w", "@pharos/api"]
    depends_on:
      db:
        condition: service_healthy
      erp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pharos:pharos@db:5432/pharos
      ERP_BASE_URL: http://erp:4100
      API_PORT: "4000"
      # The API migrates, then reseeds the synthetic world anchored to boot time (reset|if-empty|off).
      SEED_ON_BOOT: ${SEED_ON_BOOT:-reset}
      WORLD_SEED: ${WORLD_SEED:-20261114}
      # Model per prompt (default Claude Haiku 5.5), effort, refusal fallbacks (on|off). Blank = app default.
      EXTRACT_MODEL: ${EXTRACT_MODEL:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      EXTRACT_EFFORT: ${EXTRACT_EFFORT:-}
      AGENT_EFFORT: ${AGENT_EFFORT:-}
      LLM_FALLBACKS: ${LLM_FALLBACKS:-}
      # Live by default; the API refuses to start without a key in live/record mode.
      LLM_MODE: ${LLM_MODE:-live}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *node
    command: ["npm", "run", "start", "-w", "@pharos/worker"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pharos:pharos@db:5432/pharos
      AIS_MODE: ${AIS_MODE:-replay}
      WEATHER_MODE: ${WEATHER_MODE:-recorded}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}

volumes:
  pgdata:
